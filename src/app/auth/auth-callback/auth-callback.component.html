<div class="callback-wrap">

  <!-- Estado: cargando -->
  <ng-container *ngIf="loading && !errorMsg">
    <app-loader [size]="48" />
    <p class="message">Verificando acceso&hellip;</p>
  </ng-container>

  <!-- Estado: error -->
  <ng-container *ngIf="errorMsg">
    <app-icon class="error-icon" name="error_outline" size="48" />
    <p class="error-msg" role="alert">{{ errorMsg }}</p>
    <button class="btn-link" type="button" (click)="goToLogin()">
      Volver al inicio de sesión
    </button>
  </ng-container>

</div>
