<!-- El shell (backdrop, panel, header con título y ×) lo aporta app-modal. -->
<app-modal
  [open]="isOpen"
  maxWidth="480px"
  (closed)="close()">

  <div modal-title>{{ config.title }}</div>

  <p class="modal-hint">{{ config.hint }}</p>

  <label
    class="dropzone"
    [class.dragging]="isDragging"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <input type="file" [attr.accept]="config.accept" (change)="onFileSelected($event)" />
    <app-icon class="dropzone-icon" name="upload_file" size="40" />
    <span>Arrastra tu archivo aquí o toca para seleccionarlo</span>
  </label>

  <div class="mobile-actions" *ngIf="isMobile">
    <label class="btn-mobile">
      <app-icon name="photo_camera" size="18" />
      Tomar foto
      <input type="file" accept="image/*" capture="environment" (change)="onFileSelected($event)" />
    </label>
    <label class="btn-mobile">
      <app-icon name="folder_open" size="18" />
      Elegir archivo
      <input type="file" [attr.accept]="config.accept" (change)="onFileSelected($event)" />
    </label>
  </div>

  <p class="selected-file" [class.has-file]="!!selectedFile">
    <app-icon [name]="selectedFile ? 'check_circle' : 'info'" size="16" />
    {{ selectedFileName }}
  </p>

  <div modal-actions>
    <button app-button variant="light" type="button" (click)="close()">Cancelar</button>
    <button app-button variant="primary" type="button" [disabled]="!selectedFile" (click)="submit()">
      Publicar
    </button>
  </div>
</app-modal>
